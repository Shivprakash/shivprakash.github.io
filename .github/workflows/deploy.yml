name: Deploy profile

# Auto-deploy the Cloudflare Worker on every push to main.
# Requires GitHub secret: CLOUDFLARE_API_TOKEN
# (Edit Cloudflare Workers — create at https://dash.cloudflare.com/profile/api-tokens)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://profile.shiv.io

      - name: Deploy Worker (profile)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "552b3fc9d685bef17e3a479ae1dfd41c"
          command: deploy
