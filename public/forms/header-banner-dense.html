<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Google Form Header — Start a Project with Shiv Prakash (Dense)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,400;1,500&family=Montserrat:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1600px;
      height: 400px;
      overflow: hidden;
      background: #FFF4E9;
      font-family: "Montserrat", system-ui, sans-serif;
      color: #2C2420;
      -webkit-font-smoothing: antialiased;
    }

    .banner {
      position: relative;
      width: 1600px;
      height: 400px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 80% 100% at 8% 50%, rgba(202, 219, 200, 0.62) 0%, transparent 52%),
        radial-gradient(ellipse 60% 90% at 92% 20%, rgba(232, 219, 197, 0.75) 0%, transparent 48%),
        radial-gradient(ellipse 45% 70% at 78% 100%, rgba(92, 122, 88, 0.1) 0%, transparent 55%),
        linear-gradient(165deg, #FFFBF5 0%, #FFF4E9 42%, #F3E6D2 100%);
    }

    .banner::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.28;
      background-image:
        linear-gradient(90deg, rgba(92, 122, 88, 0.14) 1px, transparent 1px),
        linear-gradient(rgba(92, 122, 88, 0.14) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse 85% 95% at 40% 50%, #000 25%, transparent 72%);
      -webkit-mask-image: radial-gradient(ellipse 85% 95% at 40% 50%, #000 25%, transparent 72%);
      pointer-events: none;
    }

    .watermark {
      position: absolute;
      right: -20px;
      top: 50%;
      transform: translateY(-50%);
      width: 420px;
      height: 420px;
      opacity: 0.07;
      pointer-events: none;
      z-index: 0;
    }

    .watermark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .accent-bar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 14px;
      background: linear-gradient(180deg, #759270 0%, #5C7A58 40%, #4A6647 100%);
    }

    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 72px 0 80px;
      gap: 40px;
    }

    .mark {
      flex-shrink: 0;
      width: 148px;
      height: 148px;
      border-radius: 24px;
      background: #FFFBF5;
      border: 1.5px solid #E8DBC5;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.9) inset,
        0 16px 36px -18px rgba(44, 36, 32, 0.24);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .mark img {
      width: 108px;
      height: 108px;
      object-fit: contain;
    }

    .copy {
      flex: 1;
      min-width: 0;
      max-width: 1020px;
    }

    h1 {
      font-family: "Montserrat", system-ui, sans-serif;
      font-size: 68px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 0.98;
      color: #2C2420;
      margin-bottom: 12px;
    }

    h1 span {
      color: #5C7A58;
    }

    .subtitle {
      font-family: "Lora", Georgia, serif;
      font-size: 22px;
      font-weight: 400;
      font-style: italic;
      line-height: 1.4;
      color: #4A443F;
      max-width: 960px;
      margin-bottom: 20px;
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      font-family: "Montserrat", system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #5C7A58;
      background: rgba(202, 219, 200, 0.45);
      border: 1px solid rgba(92, 122, 88, 0.28);
      border-radius: 999px;
      padding: 8px 16px;
    }

    .bottom-rule {
      position: absolute;
      left: 80px;
      right: 72px;
      bottom: 0;
      height: 4px;
      background: linear-gradient(90deg, #5C7A58 0%, #CADBC8 28%, #E8DBC5 55%, transparent 100%);
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="banner" id="banner">
    <div class="accent-bar" aria-hidden="true"></div>
    <div class="watermark" aria-hidden="true">
      <img src="./queen.png" alt="" />
    </div>
    <div class="content">
      <div class="mark">
        <img src="./queen.png" alt="" width="108" height="108" />
      </div>
      <div class="copy">
        <h1>Start a <span>Project</span></h1>
        <p class="subtitle">
          I help organisations leap ahead on their data and agentic roadmaps —
          untangling scaling problems so they can grow into the future smoothly.
        </p>
        <div class="pills">
          <span class="pill">Consulting</span>
          <span class="pill">Hands-on Building</span>
          <span class="pill">Workshops</span>
        </div>
      </div>
    </div>
    <div class="bottom-rule" aria-hidden="true"></div>
  </div>
</body>
</html>
