<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Google Form Header — Start a Project with Shiv Prakash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,400;1,500&family=Montserrat:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1600px;
      height: 400px;
      overflow: hidden;
      background: #FFF4E9;
      font-family: "Montserrat", system-ui, sans-serif;
      color: #2C2420;
      -webkit-font-smoothing: antialiased;
    }

    .banner {
      position: relative;
      width: 1600px;
      height: 400px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 70% 90% at 12% 50%, rgba(202, 219, 200, 0.55) 0%, transparent 55%),
        radial-gradient(ellipse 55% 80% at 88% 30%, rgba(232, 219, 197, 0.7) 0%, transparent 50%),
        radial-gradient(ellipse 40% 60% at 70% 100%, rgba(92, 122, 88, 0.08) 0%, transparent 55%),
        linear-gradient(180deg, #FFFBF5 0%, #FFF4E9 48%, #F7EBD8 100%);
    }

    .banner::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.22;
      background-image:
        linear-gradient(90deg, rgba(92, 122, 88, 0.12) 1px, transparent 1px),
        linear-gradient(rgba(92, 122, 88, 0.12) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 75% 90% at 50% 50%, #000 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 75% 90% at 50% 50%, #000 20%, transparent 75%);
      pointer-events: none;
    }

    .accent-bar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 10px;
      background: linear-gradient(180deg, #759270 0%, #5C7A58 45%, #4A6647 100%);
    }

    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 88px 0 96px;
      gap: 56px;
    }

    .mark {
      flex-shrink: 0;
      width: 168px;
      height: 168px;
      border-radius: 28px;
      background: #FFFBF5;
      border: 1.5px solid #E8DBC5;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.85) inset,
        0 18px 40px -20px rgba(44, 36, 32, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .mark img {
      width: 122px;
      height: 122px;
      object-fit: contain;
    }

    .copy {
      flex: 1;
      min-width: 0;
      padding-top: 4px;
    }

    h1 {
      font-family: "Montserrat", system-ui, sans-serif;
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: #2C2420;
      margin-bottom: 16px;
    }

    h1 span {
      color: #5C7A58;
    }

    .subtitle {
      font-family: "Lora", Georgia, serif;
      font-size: 21px;
      font-weight: 400;
      font-style: italic;
      line-height: 1.45;
      color: #4A443F;
      max-width: 980px;
    }

    .bottom-rule {
      position: absolute;
      left: 96px;
      right: 72px;
      bottom: 0;
      height: 3px;
      background: linear-gradient(90deg, #5C7A58 0%, #CADBC8 35%, transparent 100%);
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="banner" id="banner">
    <div class="accent-bar" aria-hidden="true"></div>
    <div class="content">
      <div class="mark">
        <img src="./queen.png" alt="" width="122" height="122" />
      </div>
      <div class="copy">
        <h1>Start a <span>Project</span></h1>
        <p class="subtitle">
          I help organisations leap ahead on their data and agentic roadmaps —
          untangling scaling problems so they can grow into the future smoothly.
        </p>
      </div>
    </div>
    <div class="bottom-rule" aria-hidden="true"></div>
  </div>
</body>
</html>
